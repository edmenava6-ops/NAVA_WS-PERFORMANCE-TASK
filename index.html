
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Registration</h1>
    <p class="subtitle">Please fill in your information below.</p>

    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" data-label="Student ID"
                   placeholder="e.g. 2026-0001">
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" data-label="Full Name"
                   placeholder="Enter your full name">
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" data-label="Email"
                   placeholder="example@email.com">
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" data-label="Phone Number"
                   placeholder="09XXXXXXXXX">
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" data-label="Date of Birth">
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" data-label="Gender">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="program">Program</label>
            <select id="program" data-label="Program">
                <option value="">Select program</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Computer Science</option>
                <option value="BSBA">BS Business Administration</option>
                <option value="BSED">BS Secondary Education</option>
            </select>
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="yearLevel">Year Level</label>
            <select id="yearLevel" data-label="Year Level">
                <option value="">Select year level</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" data-label="Password"
                   placeholder="At least 8 characters">
            <small class="error-message"></small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   data-label="Confirm Password"
                   placeholder="Re-enter your password">
            <small class="error-message"></small>
        </div>

        <button type="button" id="togglePassword" class="toggle-btn">
            Show/Hide Password
        </button>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" data-label="Address"
                      placeholder="Enter your complete address"></textarea>
            <small class="error-message"></small>
        </div>

        <div class="agreement">
            <input type="checkbox" id="agreement">
            <label for="agreement">
                I confirm that the information provided is correct.
            </label>
        </div>
        <small id="agreementError" class="error-message"></small>

        <div class="buttons">
            <button type="submit" class="submit-btn">Register</button>
            <button type="reset" class="reset-btn">Reset</button>
        </div>

        <p id="successMessage" role="status" aria-live="polite"></p>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
